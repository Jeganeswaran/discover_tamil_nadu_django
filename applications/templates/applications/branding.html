<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Manage the official Discover Tamil Nadu programme branding.">
        <script src="https://cdn.tailwindcss.com"></script>
        <title>Branding</title>
    </head>
    <body class="bg-slate-50">
        <header class="bg-[#8f1d24] text-white">
            <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between">
                <div>
                    <div class="font-black">Discover Tamil Nadu</div>
                    <div class="text-xs text-white/70">Committee workspace</div>
                </div>
                <a href="{% url 'committee' %}" class="text-sm font-bold">Dashboard</a>
            </div>
        </header>
        <main class="max-w-3xl mx-auto p-6">
            <div class="bg-white border rounded-3xl p-7">
                <h1 class="text-2xl font-black">Logo & Branding</h1>
                <p class="text-slate-500 mt-1 mb-6">Upload the official programme logo. It will appear on the public application and committee workspace.</p>
                {% if brand.logo %}
                    <div class="mb-6 rounded-2xl bg-slate-50 p-5">
                        <img src="{{ brand.logo.url }}" alt="Official Discover Tamil Nadu programme logo displayed on a light background" class="max-h-24 max-w-xs object-contain">
                    </div>
                {% endif %}
                <form method="post" enctype="multipart/form-data" class="space-y-5">
                    {% csrf_token %}
                    <div>
                        <label class="font-bold">Programme name</label>
                        {{ form.name }}
                    </div>
                    <div>
                        <label class="font-bold block mb-2">Logo</label>
                        {{ form.logo }}
                    </div>
                    <button type="submit" class="bg-[#8f1d24] text-white rounded-xl px-6 py-3 font-bold">Save branding</button>
                </form>
            </div>
        </main>
    </body>
</html>
