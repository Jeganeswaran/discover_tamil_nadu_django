<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Committee Login | Discover Tamil Nadu</title></head><body class="min-h-screen bg-slate-950 flex items-center justify-center p-6"><div class="w-full max-w-md"><div class="bg-white rounded-3xl p-8 shadow-2xl"><div class="w-14 h-14 rounded-2xl bg-[#8f1d24] text-white grid place-items-center font-black text-xl mb-5">TN</div><p class="text-xs font-bold tracking-[.18em] uppercase text-slate-500">Discover Tamil Nadu 2026–27</p><h1 class="text-2xl font-black mt-2">Selection Committee</h1><p class="text-slate-500 mt-2 mb-7">Sign in to review applications and manage selection.</p><form method="post" class="space-y-4">{% csrf_token %}{% if form.non_field_errors %}<div class="bg-red-50 text-red-700 p-3 rounded-xl text-sm">{{form.non_field_errors}}</div>{% endif %}<div><label class="text-sm font-bold">Username</label>{{form.username}}</div><div><label class="text-sm font-bold">Password</label>{{form.password}}</div><button class="w-full bg-[#8f1d24] text-white rounded-xl py-3.5 font-bold">Sign in securely</button></form><a href="/" class="block text-center text-sm text-slate-500 mt-5">← Back to application</a></div></div><style>input{width:100%;margin-top:6px;border:1px solid #dbe2ea;border-radius:12px;padding:12px}input:focus{outline:2px solid #8f1d24}</style></body></html>
